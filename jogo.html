<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Jogo de Adivinhação</title>
	<style>
		:root {
			--ink: #202a44;
			--muted: #69738e;
			--paper: #fffdf7;
			--accent: #ef6f51;
			--accent-dark: #c95138;
			--teal: #227c78;
			--line: #e5dfd2;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
			background-color: #dbe9e5;
			background-image: radial-gradient(#b7d1ca 1px, transparent 1px), linear-gradient(135deg, #f3d7b7 0%, #dbe9e5 54%, #c9d8ed 100%);
			background-size: 22px 22px, auto;
		}

		.game-card {
			width: min(100%, 520px);
			padding: clamp(28px, 7vw, 54px);
			border: 1px solid rgba(32, 42, 68, 0.1);
			border-radius: 8px;
			background: var(--paper);
			box-shadow: 0 22px 60px rgba(32, 42, 68, 0.18);
			animation: arrive 650ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--teal);
			font: 700 0.75rem/1.2 Arial, sans-serif;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.2rem, 8vw, 3.6rem);
			line-height: 0.98;
		}

		.intro {
			margin: 22px 0 30px;
			color: var(--muted);
			font-size: 1.08rem;
			line-height: 1.6;
		}

		.guess-form { display: flex; gap: 10px; }

		input, button {
			min-height: 52px;
			border-radius: 4px;
			font: 700 1rem Arial, sans-serif;
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 0 16px;
			color: var(--ink);
			border: 2px solid var(--line);
			outline: none;
		}

		input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(34, 124, 120, 0.15); }

		button {
			padding: 0 22px;
			color: #fff;
			border: 0;
			background: var(--accent);
			cursor: pointer;
			transition: background 180ms ease, transform 180ms ease;
		}

		button:hover { background: var(--accent-dark); transform: translateY(-2px); }
		button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

		.message {
			min-height: 30px;
			margin: 28px 0 8px;
			font-size: 1.35rem;
			font-weight: 700;
		}

		.message.success { color: var(--teal); }
		.message.error { color: var(--accent-dark); }

		.attempts {
			margin: 0;
			color: var(--muted);
			font: 700 0.9rem/1.4 Arial, sans-serif;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(14px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 430px) {
			.guess-form { flex-direction: column; }
			button { width: 100%; }
		}
	</style>
</head>
<body>
	<main class="game-card">
		<p class="eyebrow">Desafio rápido</p>
		<h1>Jogo de Adivinhação</h1>
		<p class="intro">Pensei em um número entre 1 e 100. Faça seu palpite e use as dicas para encontrar o número secreto em até 10 tentativas.</p>

		<form class="guess-form" id="guessForm">
			<label for="guess" hidden>Seu palpite</label>
			<input id="guess" name="guess" type="number" min="1" max="100" placeholder="Digite um número" required autofocus>
			<button type="submit" id="guessButton">Chutar</button>
		</form>

		<p class="message" id="message" aria-live="polite">Qual é o seu primeiro palpite?</p>
		<p class="attempts" id="attempts" aria-live="polite">Tentativas restantes: 10</p>
	</main>

	<script src="chute.js"></script>
</body>
</html>
